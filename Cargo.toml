[package]
name = "repo-manager"
version = "0.1.0"
edition = "2021"
description = "TUI manager for cloning and updating github.com/vianch repos"

[[bin]]
name = "repo-manager"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fuzzy-matcher = "0.3"

[profile.release]
strip = true
